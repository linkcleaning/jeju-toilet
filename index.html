<!doctype html>
<html lang="ko-KR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5, viewport-fit=cover" />
  <meta name="theme-color" content="#172A3A" />
  <meta name="description" content="제주 공식 공공데이터 기반 공중화장실 찾기 — 지도, 편의시설 필터, 길찾기, 4개 언어, 귤랑이 음성 안내" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Ddong" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152.png" />
  <link rel="apple-touch-icon" sizes="167x167" href="icons/icon-167.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css" />
  <link rel="stylesheet" href="css/app.css" />
  <title>Ddong · 제주 공중화장실</title>
</head>
<body>
  <a class="skip-link" href="#main" data-i18n="header.skip">지도와 검색으로 바로가기</a>
  <div class="shell">
    <header class="app-header">
      <div class="header-inner">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true"><span data-icon="pin"></span><i></i></div>
          <div class="brand-text">
            <h1><span data-i18n="app.title">제주 공중화장실</span> <b class="app-name">Ddong</b></h1>
            <p data-i18n="app.subtitle">가까운 안심 화장실을 빠르게</p>
          </div>
        </div>
        <label class="lang">
          <span class="sr-only" data-i18n="header.language">언어 선택</span>
          <span data-icon="languages"></span>
          <select id="lang-select"></select>
          <b aria-hidden="true">▼</b>
        </label>
      </div>
    </header>

    <section class="search-bar" id="search-bar">
      <div class="search-inner">
        <div class="search-field">
          <span data-icon="search"></span>
          <input id="search" type="search" autocomplete="off" enterkeyhint="search" />
          <button type="button" id="search-clear" class="search-clear" hidden><span data-icon="x"></span></button>
        </div>
        <div class="chips" id="filters" role="group"></div>
      </div>
    </section>

    <main id="main" tabindex="-1">
      <section id="view-list" class="view list-view"></section>
      <section id="view-map" class="view map-view" hidden>
        <div class="map-underlay" aria-hidden="true"></div>
        <div id="map"></div>
        <div id="map-fallback" class="map-fallback" hidden></div>
        <div class="map-shade" aria-hidden="true"></div>
        <div class="map-count" aria-live="polite"><i></i><span id="map-count"></span></div>
        <button type="button" class="map-locate" id="map-locate"><span data-icon="locate"></span></button>
        <button type="button" class="map-toast" id="map-toast" hidden></button>
      </section>
      <section id="view-guide" class="view guide-view" hidden></section>
      <section id="view-sos" class="view sos-view" hidden></section>
    </main>

    <div class="mascot-float" id="mascot-float" hidden></div>
    <section id="drawer" class="drawer" role="dialog" aria-modal="false" aria-labelledby="drawer-title" hidden></section>

    <nav class="bottom-nav" id="bottom-nav"></nav>
    <div class="phrase-modal" id="phrase-modal" role="dialog" aria-modal="true" hidden></div>
    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    <span class="sr-only" id="live" aria-live="polite"></span>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
